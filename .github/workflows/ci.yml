name: Validation
on:
  pull_request:
  push:
    branches: [main, master, develop, development]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_APP_ENV: mock
      EXPO_PUBLIC_API_BASE_URL_MOCK: http://localhost:4011
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo install --check
      - run: npx expo export --platform all
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Dependency report
        if: always()
        run: npm audit --json > dependency-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ github.sha }}
          path: |
            dependency-audit.json
            playwright-report/
            test-results/
